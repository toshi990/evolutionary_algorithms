<svg xmlns="http://www.w3.org/2000/svg" width="820" height="560" viewBox="0 0 820 560"><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" font-size="14" fill="#202020"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#444"/></marker></defs><rect x="90" y="30" width="420" height="42" rx="4" fill="#f6f6f6" stroke="#666"/><text x="300" y="56" text-anchor="middle">Равномерная инициализация популяции</text><rect x="90" y="95" width="420" height="42" rx="4" fill="#f6f6f6" stroke="#666"/><text x="300" y="121" text-anchor="middle">Оценка функции и сохранение лучшего</text><rect x="90" y="300" width="420" height="42" rx="4" fill="#f6f6f6" stroke="#666"/><text x="300" y="326" text-anchor="middle">Элитизм и турнирный выбор родителей</text><rect x="90" y="365" width="420" height="42" rx="4" fill="#f6f6f6" stroke="#666"/><text x="300" y="391" text-anchor="middle">Арифметический кроссовер и мутация</text><rect x="90" y="430" width="420" height="42" rx="4" fill="#f6f6f6" stroke="#666"/><text x="300" y="456" text-anchor="middle">Обрезка координат и оценка потомков</text><path d="M300 72 V95 M300 137 V170 M300 342 V365 M300 407 V430" fill="none" stroke="#444" marker-end="url(#arrow)"/><path d="M300 170 L450 220 L300 270 L150 220 Z" fill="#f6f6f6" stroke="#666"/><text x="300" y="225" text-anchor="middle">Бюджет исчерпан?</text><path d="M300 270 V300" stroke="#444" marker-end="url(#arrow)"/><text x="310" y="291">Нет</text><path d="M450 220 H660 V270" fill="none" stroke="#444" marker-end="url(#arrow)"/><text x="490" y="209">Да</text><rect x="560" y="270" width="220" height="42" fill="#f6f6f6" stroke="#666"/><text x="670" y="296" text-anchor="middle">Лучшее решение</text><path d="M300 472 V510 H40 V220 H150" fill="none" stroke="#444" marker-end="url(#arrow)"/></g></svg>