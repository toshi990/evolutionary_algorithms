<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Улучшенный генетический алгоритм — вариант 14</title>
  <style>
    *{box-sizing:border-box}body{margin:0;color:#18202b;background:#f2f5f9;font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:18px 24px;color:#fff;background:linear-gradient(115deg,#3b0764,#7e22ce)}h1{margin:0 0 4px;font-size:23px}header p{margin:0;color:#f3e8ff}.controls{display:flex;flex-wrap:wrap;align-items:end;gap:10px;padding:12px 20px;background:#fff;border-bottom:1px solid #d8dee8}label{display:grid;gap:4px;color:#4b5563;font-size:12px}input{width:90px;padding:7px 8px;border:1px solid #b8c1ce;border-radius:6px;font:inherit}input[type=range]{width:130px;padding:0}button{padding:8px 13px;border:1px solid #aeb8c6;border-radius:7px;background:#fff;color:#172033;font-weight:600;cursor:pointer}button:hover{background:#faf5ff;border-color:#a855f7}button.primary{color:#fff;border-color:#7e22ce;background:#9333ea}main{display:grid;grid-template-columns:minmax(580px,1.4fr) minmax(380px,1fr);gap:14px;padding:14px;height:calc(100vh - 137px);min-height:620px}section{min-width:0;overflow:hidden;border:1px solid #d5dce7;border-radius:10px;background:#fff;box-shadow:0 2px 8px #27364a12}.section-title{padding:10px 13px;border-bottom:1px solid #e2e7ef;font-weight:700}.population{height:calc(100% - 43px);overflow:auto;padding:8px}.person{display:grid;grid-template-columns:36px repeat(7,minmax(48px,1fr)) 100px;align-items:center;gap:3px;min-height:25px;margin-bottom:2px;padding:2px 4px;border:2px solid transparent;border-radius:5px}.person.tournament{border-color:#eab308;background:#fef9c3}.person.winner{border-color:#16a34a;background:#dcfce7}.index{font-weight:700;color:#475569}.gene{display:grid;place-items:center;height:19px;border-radius:3px;font-size:11px;color:#111827;text-shadow:0 1px #fff9}.fitness{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}.process{height:calc(100% - 43px);overflow:auto;padding:14px}.stage{margin-bottom:12px;padding:12px;border-left:5px solid #9333ea;background:#faf5ff;border-radius:6px}.stage strong{display:block;margin-bottom:3px;font-size:16px;color:#581c87}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.metric{padding:8px 10px;border:1px solid #e0e5ed;border-radius:7px}.metric small{display:block;color:#667085}.metric b{font-size:15px;font-variant-numeric:tabular-nums}.contestant{display:flex;justify-content:space-between;gap:8px;margin:5px 0;padding:8px;border:1px solid #eab308;border-radius:6px;background:#fef9c3}.contestant.win{border-color:#16a34a;background:#dcfce7;font-weight:700}.chromosome{margin:8px 0 13px}.chromosome-title{margin-bottom:4px;font-weight:700}.genes{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.genes span{padding:7px 2px;text-align:center;border:1px solid #a7b2c1;border-radius:4px;background:#ede9fe;font-size:11px}.genes span.mutated{border-color:#dc2626;background:#fecaca;font-weight:700}.genes span.reset-gene{border-color:#ea580c;background:#fdba74;font-weight:700}.explanation{margin-top:12px;padding:10px;border-radius:6px;background:#f8fafc;color:#475569}svg{width:100%;height:250px;border:1px solid #e1e6ee;border-radius:6px;background:#fff}.legend{display:flex;flex-wrap:wrap;gap:12px;padding:0 20px 12px;color:#596579;font-size:12px}.key:before{content:"";display:inline-block;width:12px;height:12px;margin-right:5px;vertical-align:-2px;border:1px solid #687386;border-radius:2px;background:var(--c)}@media(max-width:980px){main{grid-template-columns:1fr;height:auto}section{min-height:600px}}
  </style>
</head>
<body>
<header><h1>Улучшенный ГА: гибридная мутация</h1><p>Редкий дальний сброс гена помогает покинуть локальный минимум +2.7468</p></header>
<div class="controls">
  <label>Seed<input id="seed" type="number" value="14"></label><label>σ мутации<input id="sigma" type="number" min="0.05" max="2" step="0.05" value="0.8"></label><label>Вероятность сброса<input id="resetProb" type="number" min="0" max="1" step="0.01" value="0.05"></label><label>Скорость<input id="speed" type="range" min="100" max="1500" step="50" value="650"></label>
  <button id="play" class="primary">▶ Запустить</button><button id="step">Один шаг</button><button id="generation">Следующее поколение</button><button id="reset">Сброс</button>
</div>
<main><section><div class="section-title">Популяция: строка — особь, цветные ячейки — 7 генов</div><div id="population" class="population"></div></section><section><div class="section-title">Текущая операция</div><div id="process" class="process"></div></section></main>
<div class="legend"><span class="key" style="--c:#fef9c3">участник турнира</span><span class="key" style="--c:#dcfce7">победитель</span><span class="key" style="--c:#fecaca">гауссовская мутация</span><span class="key" style="--c:#fdba74">дальний случайный сброс</span></div>
<script>
(()=>{
const D=7,N=30,ELITE=1,PC=.9,PM=1/D,GLOBAL_MIN=-274.1631599264;let s,timer=null;
const $=id=>document.getElementById(id),seed=$('seed'),sigma=$('sigma'),resetProb=$('resetProb'),speed=$('speed'),play=$('play'),population=$('population'),process=$('process');
function seeded(n){let a=n>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gaussian(){let u=Math.max(s.rng(),1e-12),v=s.rng();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
const objective=x=>.5*x.reduce((a,v)=>a+v**4-16*v**2+5*v,0),person=()=>Array.from({length:D},()=>-5+10*s.rng());
function pause(){if(timer)clearInterval(timer);timer=null;play.textContent='▶ Запустить'}
function reset(){pause();s={rng:seeded(+seed.value||0),sigma:+sigma.value||.8,resetProb:+resetProb.value||0,pop:[],values:[],gen:0,evals:0,stage:'ready',ta:[],tb:[],wa:null,wb:null,before:null,after:null,modes:null,children:[],history:[]};s.pop=Array.from({length:N},person);s.values=s.pop.map(objective);s.evals=N;s.history=[Math.min(...s.values)];render()}
function tournament(){let a=[];while(a.length<3){let i=Math.floor(s.rng()*N);if(!a.includes(i))a.push(i)}return[a,a.reduce((x,y)=>s.values[x]<s.values[y]?x:y)]}
function crossover(a,b){if(s.rng()>=PC)return[a.slice(),b.slice()];let x=[],y=[];for(let i=0;i<D;i++){let k=s.rng();x.push(k*a[i]+(1-k)*b[i]);y.push((1-k)*a[i]+k*b[i])}return[x,y]}
function mutate(x){let values=[],modes=[];for(const original of x){let v=original,mode='';if(s.rng()<PM){if(s.rng()<s.resetProb){v=-5+10*s.rng();mode='reset-gene'}else{v=Math.max(-5,Math.min(5,v+gaussian()*s.sigma));mode='mutated'}}values.push(v);modes.push(mode)}return[values,modes]}
function one(){if(s.stage==='ready'||s.stage==='complete'){[s.ta,s.wa]=tournament();s.tb=[];s.wb=null;s.before=s.after=s.modes=null;s.stage='ta'}else if(s.stage==='ta'){[s.tb,s.wb]=tournament();s.stage='tb'}else if(s.stage==='tb'){s.before=crossover(s.pop[s.wa],s.pop[s.wb]);s.stage='cross'}else if(s.stage==='cross'){let m=s.before.map(mutate);s.after=m.map(v=>v[0]);s.modes=m.map(v=>v[1]);s.stage='mutation'}else if(s.stage==='mutation'){for(const c of s.after)if(s.children.length<N-ELITE)s.children.push(c);if(s.children.length===N-ELITE){let bi=s.values.indexOf(Math.min(...s.values)),elite=s.pop[bi].slice(),ev=s.values[bi],cv=s.children.map(objective);s.evals+=s.children.length;s.pop=[elite,...s.children];s.values=[ev,...cv];s.children=[];s.gen++;s.history.push(Math.min(...s.values));s.stage='complete'}else s.stage='ready'}render()}
function nextGen(){let g=s.gen;do one();while(s.gen===g)}function toggle(){if(timer)pause();else{play.textContent='⏸ Пауза';timer=setInterval(one,+speed.value)}}
function color(v){let r=(v+5)/10;if(r<.5){let c=Math.round(510*r);return`rgb(${c},${c},255)`}let c=Math.round(255*(2-2*r));return`rgb(255,${c},${c})`}
function renderPop(){let active=s.stage==='ta'?s.ta:s.stage==='tb'?s.tb:[],win=s.stage==='ta'?s.wa:s.stage==='tb'?s.wb:null;population.innerHTML=s.pop.map((p,i)=>`<div class="person ${i===win?'winner':active.includes(i)?'tournament':''}"><span class="index">#${i+1}</span>${p.map(v=>`<span class="gene" style="background:${color(v)}">${v.toFixed(1)}</span>`).join('')}<span class="fitness">${s.values[i].toFixed(2)}</span></div>`).join('')}
const stages={ready:['ГОТОВ К ТУРНИРУ','Нажмите «Один шаг»: три случайные особи будут бороться за право стать родителем.'],ta:['ТУРНИР 1','Из трёх жёлтых участников выбран зелёный победитель с наименьшим f(x).'],tb:['ТУРНИР 2','Выбран второй родитель. Следующий шаг выполнит кроссовер.'],cross:['КРОССОВЕР','Координаты победителей смешаны арифметическим кроссовером.'],mutation:['МУТАЦИЯ','Некоторые гены случайно изменены и выделены красным.'],complete:['НОВОЕ ПОКОЛЕНИЕ','Элита сохранена, потомки заменили остальные особи.']};
function chromosome(title,x,modes){return`<div class="chromosome"><div class="chromosome-title">${title}</div><div class="genes">${x.map((v,i)=>`<span class="${modes?modes[i]:''}">${v.toFixed(2)}</span>`).join('')}</div></div>`}
function tour(a,w){return`<h3>Три участника турнира</h3>${a.map(i=>`<div class="contestant ${i===w?'win':''}"><span>Особь #${i+1}</span><span>f(x)=${s.values[i].toFixed(6)} ${i===w?'← победитель':''}</span></div>`).join('')}<div class="explanation">Вероятности не вычисляются: турнир напрямую сравнивает три значения и выбирает наименьшее.</div>`}
function plot(){let w=400,h=250,p=28,v=[...s.history,GLOBAL_MIN],lo=Math.min(...v),hi=Math.max(...v),span=Math.max(hi-lo,1),pts=s.history.map((v,i)=>`${p+i/Math.max(1,s.history.length-1)*(w-2*p)},${p+(hi-v)/span*(h-2*p)}`).join(' '),ty=p+(hi-GLOBAL_MIN)/span*(h-2*p);return`<h3>Лучшее значение по поколениям</h3><svg viewBox="0 0 ${w} ${h}"><line x1="${p}" y1="${ty}" x2="${w-p}" y2="${ty}" stroke="#16a34a" stroke-dasharray="5 4"/><text x="${w-p}" y="${ty-7}" text-anchor="end" fill="#166534" font-size="11">глобальный минимум</text>${pts.includes(' ')?`<polyline points="${pts}" fill="none" stroke="#2563eb" stroke-width="3"/>`:`<circle cx="${pts.split(',')[0]}" cy="${pts.split(',')[1]}" r="4" fill="#2563eb"/>`}</svg>`}
function renderProcess(){let[title,text]=stages[s.stage],body='';if(s.stage==='ta')body=tour(s.ta,s.wa);else if(s.stage==='tb')body=tour(s.tb,s.wb);else if(s.stage==='cross')body=chromosome('Родитель 1',s.pop[s.wa])+chromosome('Родитель 2',s.pop[s.wb])+chromosome('Потомок 1',s.before[0])+chromosome('Потомок 2',s.before[1]);else if(s.stage==='mutation')body=chromosome('Потомок 1 после мутации',s.after[0],s.modes[0])+chromosome('Потомок 2 после мутации',s.after[1],s.modes[1])+`<div class="explanation">Красный ген получил локальное гауссовское изменение. Оранжевый ген полностью перегенерирован в [−5, 5] с вероятностью ${s.resetProb} среди мутаций — это позволяет перепрыгнуть барьер между локальным и глобальным минимумами.</div>`;else body=plot();process.innerHTML=`<div class="stage"><strong>${title}</strong>${text}</div><div class="metrics"><div class="metric"><small>Поколение</small><b>${s.gen}</b></div><div class="metric"><small>Лучшее f(x)</small><b>${Math.min(...s.values).toFixed(6)}</b></div><div class="metric"><small>Вычислений</small><b>${s.evals}</b></div><div class="metric"><small>Потомков</small><b>${s.children.length}/29</b></div></div>${body}`}
function render(){renderPop();renderProcess()}play.onclick=toggle;$('step').onclick=one;$('generation').onclick=nextGen;$('reset').onclick=reset;speed.onchange=()=>{if(timer){pause();toggle()}};reset();
})();
</script></body></html>
